apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hwainoree
resources:
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/ingress.yaml
configMapGenerator:
  - name: pomodoro-web
    files:
      - dist/index.html
      - dist/styles.css
      - dist/app.js
      - dist/timer-core.js
  - name: pomodoro-nginx
    files:
      - k8s/nginx.conf
