apiVersion: apps/v1
kind: Deployment
metadata:
  name: pomodoro
  labels:
    app.kubernetes.io/name: pomodoro
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pomodoro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pomodoro
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: nginx:1.28.0-alpine
          # Use our complete config directly; no entrypoint scripts are needed.
          command: [nginx]
          args: [-g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: pomodoro-web
        - name: config
          configMap:
            name: pomodoro-nginx
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
